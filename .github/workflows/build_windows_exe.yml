name: Build Windows Standalone EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build BEOMCHRO.exe
        run: |
          pyinstaller --noconfirm --onefile --name=BEOMCHRO --add-data="simulator;simulator" --add-data="extension;extension" beomchro_core.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEOMCHRO-Windows-Standalone-EXE
          path: dist/BEOMCHRO.exe
